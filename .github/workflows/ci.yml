name: CI

on:
  push:
    branches: [dev, preprod, prod]
  pull_request:
    branches: [dev, preprod, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.2
          cache: pip
          cache-dependency-path: apps/django/requirements-dev.txt
      - run: python -m pip install --requirement apps/django/requirements-dev.txt
      - run: python apps/django/manage.py check
      - run: pytest
      - run: python -m ruff check apps/django
      - run: mypy apps/django

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  compose-odoo:
    name: Compose and Odoo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: python -m compileall -q apps/odoo/addons/csrs_reporting
      - run: python -c 'from pathlib import Path; import xml.etree.ElementTree as ET; [ET.parse(path) for path in Path("apps/odoo").rglob("*.xml")]'
      - run: bash -n scripts/*.sh infrastructure/compose/odoo/image/*.sh infrastructure/deploy/*
      - run: ./scripts/test_odoo.sh

  promotion-policy:
    name: Promotion policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch promotion
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" == preprod && "$HEAD" != dev ]]; then
            echo "preprod accepte uniquement une promotion depuis dev." >&2
            exit 1
          fi
          if [[ "$BASE" == prod && "$HEAD" != preprod ]]; then
            echo "prod accepte uniquement une promotion depuis preprod." >&2
            exit 1
          fi

  deploy-preprod:
    name: Deploy preproduction
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    needs: [python, frontend, compose-odoo]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: csrs-ent-preprod
    environment:
      name: preprod
      url: https://preprod.ent.koba.sarl/
    steps:
      - name: Configure restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.CSRS_ENT_PREPROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CSRS_ENT_PREPROD_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/csrs_ent_preprod
          chmod 0600 ~/.ssh/csrs_ent_preprod
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Deploy tested revision
        env:
          DEPLOY_HOST: ${{ vars.CSRS_ENT_PREPROD_HOST }}
          DEPLOY_PORT: ${{ vars.CSRS_ENT_PREPROD_PORT }}
          DEPLOY_USER: ${{ vars.CSRS_ENT_PREPROD_USER }}
        run: ssh -i ~/.ssh/csrs_ent_preprod -p "${DEPLOY_PORT:-22}" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
