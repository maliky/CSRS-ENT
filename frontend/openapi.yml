components:
  schemas:
    ActionEnum:
      enum:
        - deactivate
        - delete
      type: string
      description: |-
        * `deactivate` - deactivate
        * `delete` - delete
    AgendaDirectionEnum:
      enum:
        - programs
        - administration
      type: string
      description: |-
        * `programs` - programs
        * `administration` - administration
    AgendaDraft:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        major_events:
          type: string
          default: ""
        revision:
          type: integer
          minimum: 0
          nullable: true
      required:
        - period_end
        - period_start
    AgendaGenerate:
      type: object
      properties:
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        agenda_direction:
          $ref: "#/components/schemas/AgendaDirectionEnum"
      required:
        - agenda_direction
        - period_end
        - period_start
    Availability:
      type: object
      properties:
        employee_id:
          type: integer
          minimum: 1
        kind:
          $ref: "#/components/schemas/KindEnum"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
          default: ""
        revision:
          type: integer
          minimum: 1
      required:
        - employee_id
        - end_date
        - kind
        - start_date
    BlankEnum:
      enum:
        - ""
    Cancel:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 500
          minLength: 1
      required:
        - reason
        - revision
    ConfirmationEnum:
      enum:
        - SUPPRIMER
      type: string
      description: "* `SUPPRIMER` - SUPPRIMER"
    DecisionEnum:
      enum:
        - accept
        - reject
      type: string
      description: |-
        * `accept` - accept
        * `reject` - reject
    KindEnum:
      enum:
        - leave
        - absence
        - mission
      type: string
      description: |-
        * `leave` - leave
        * `absence` - absence
        * `mission` - mission
    Observation:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        message:
          type: string
      required:
        - message
        - revision
    OrganizationUnit:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]{1,32}$
        short_name:
          type: string
          maxLength: 80
        long_name:
          type: string
          maxLength: 180
        kind:
          type: string
          default: unit
          maxLength: 32
        display_order:
          type: integer
          minimum: 0
          default: 0
        parent_id:
          type: integer
          minimum: 1
          nullable: true
        active:
          type: boolean
          default: true
        state_token:
          type: string
        reason:
          oneOf:
            - type: string
              default: ""
              maxLength: 500
              minLength: 3
            - type: string
              maxLength: 0
      required:
        - code
        - long_name
        - short_name
    Password:
      type: object
      properties:
        current_password:
          type: string
          maxLength: 4096
        new_password:
          type: string
          maxLength: 4096
          minLength: 12
        new_password_confirmation:
          type: string
          maxLength: 4096
          minLength: 12
      required:
        - current_password
        - new_password
        - new_password_confirmation
    PatchedAvailability:
      type: object
      properties:
        employee_id:
          type: integer
          minimum: 1
        kind:
          $ref: "#/components/schemas/KindEnum"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        note:
          type: string
          default: ""
        revision:
          type: integer
          minimum: 1
    PatchedOrganizationUnitUpdate:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          pattern: ^[A-Za-z0-9_-]{1,32}$
        short_name:
          type: string
          maxLength: 80
        long_name:
          type: string
          maxLength: 180
        kind:
          type: string
          default: unit
          maxLength: 32
        display_order:
          type: integer
          minimum: 0
          default: 0
        parent_id:
          type: integer
          minimum: 1
          nullable: true
        active:
          type: boolean
          default: true
        state_token:
          type: string
        reason:
          oneOf:
            - type: string
              default: ""
              maxLength: 500
              minLength: 3
            - type: string
              maxLength: 0
    PatchedProposalUpdate:
      type: object
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        title:
          type: string
          maxLength: 180
        description:
          type: string
        action_id:
          type: integer
          minimum: 1
          nullable: true
        calendar_id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
    PatchedTaskUpdate:
      type: object
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 180
        description:
          type: string
        action_id:
          type: integer
          minimum: 1
          nullable: true
    PatchedUserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        login_alias:
          nullable: true
          oneOf:
            - type: string
              maxLength: 32
              pattern: ^[a-z][a-z0-9_-]*$
            - type: string
              maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        position:
          type: string
          maxLength: 160
        phone:
          type: string
          maxLength: 32
        agenda_direction:
          oneOf:
            - $ref: "#/components/schemas/AgendaDirectionEnum"
            - $ref: "#/components/schemas/BlankEnum"
        include_in_direction_agendas:
          type: boolean
          default: true
        unit_ids:
          type: array
          items:
            type: integer
            minimum: 1
        primary_unit_id:
          type: integer
          minimum: 1
          nullable: true
        primary_supervisor_id:
          type: integer
          minimum: 1
          nullable: true
        organization_effective_date:
          type: string
          format: date
        state_token:
          type: string
    PlanningPreview:
      type: object
      properties:
        calendar_id:
          type: integer
          minimum: 1
        start_date:
          type: string
          format: date
        source:
          $ref: "#/components/schemas/SourceEnum"
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
      required:
        - calendar_id
        - source
        - start_date
    Progress:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        entry_date:
          type: string
          format: date
        percentage:
          type: integer
          maximum: 100
          minimum: 0
        note:
          type: string
          default: ""
        blocked:
          type: boolean
          default: false
      required:
        - percentage
        - revision
    ProposalCreate:
      type: object
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        title:
          type: string
          maxLength: 180
        description:
          type: string
        action_id:
          type: integer
          minimum: 1
          nullable: true
        calendar_id:
          type: integer
          minimum: 1
      required:
        - calendar_id
        - description
        - due_date
        - estimated_work_days
        - start_date
        - title
    ProposalDecision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        decision:
          $ref: "#/components/schemas/DecisionEnum"
        reason:
          type: string
          default: ""
      required:
        - decision
        - revision
    Revision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
      required:
        - revision
    RevokeGrant:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
      required:
        - reason
    RoleGrant:
      type: object
      properties:
        user_id:
          type: integer
          minimum: 1
        department_id:
          type: integer
          minimum: 1
        role_code:
          type: string
          maxLength: 64
        scope:
          $ref: "#/components/schemas/ScopeEnum"
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          maxLength: 500
          minLength: 3
      required:
        - department_id
        - reason
        - role_code
        - scope
        - user_id
        - valid_from
    ScopeEnum:
      enum:
        - unit
        - tree
      type: string
      description: |-
        * `unit` - unit
        * `tree` - tree
    SourceEnum:
      enum:
        - workload
        - due
      type: string
      description: |-
        * `workload` - workload
        * `due` - due
    StateToken:
      type: object
      properties:
        state_token:
          type: string
      required:
        - state_token
    TaskBulkDelete:
      type: object
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/TaskSelection"
        reason:
          type: string
          maxLength: 500
          minLength: 3
        confirmation:
          $ref: "#/components/schemas/ConfirmationEnum"
      required:
        - assignments
        - confirmation
        - reason
    TaskCreate:
      type: object
      properties:
        start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        estimated_work_days:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
        title:
          type: string
          maxLength: 180
        description:
          type: string
        employee_id:
          type: integer
          minimum: 1
        action_id:
          type: integer
          minimum: 1
          nullable: true
        calendar_id:
          type: integer
          minimum: 1
      required:
        - calendar_id
        - description
        - due_date
        - employee_id
        - estimated_work_days
        - start_date
        - title
    TaskSelection:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
      required:
        - id
        - revision
    Transition:
