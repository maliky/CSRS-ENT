          default: ""
      required:
        - action
        - users
    UserSelection:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        state_token:
          type: string
      required:
        - id
        - state_token
    UserWrite:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        login_alias:
          nullable: true
          oneOf:
            - type: string
              maxLength: 32
              pattern: ^[a-z][a-z0-9_-]*$
            - type: string
              maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        position:
          type: string
          maxLength: 160
        phone:
          type: string
          maxLength: 32
        agenda_direction:
          oneOf:
            - $ref: "#/components/schemas/AgendaDirectionEnum"
            - $ref: "#/components/schemas/BlankEnum"
        include_in_direction_agendas:
          type: boolean
          default: true
        unit_ids:
          type: array
          items:
            type: integer
            minimum: 1
        primary_unit_id:
          type: integer
          minimum: 1
          nullable: true
        primary_supervisor_id:
          type: integer
          minimum: 1
          nullable: true
        organization_effective_date:
          type: string
          format: date
        state_token:
          type: string
      required:
        - email
        - organization_effective_date
    Visit:
      type: object
      properties:
        party_size:
