[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "csrs_ent.settings"
pythonpath = ["apps/django"]
testpaths = ["apps/django/tests"]
python_files = ["test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_configs = true
mypy_path = ["apps/django"]
exclude = ["apps/odoo/"]

[tool.django-stubs]
django_settings_module = "csrs_ent.settings"
