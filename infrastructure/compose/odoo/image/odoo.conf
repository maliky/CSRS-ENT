[options]
data_dir = /var/lib/odoo
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_name = pent_odoo
dbfilter = ^pent_odoo$
list_db = False
proxy_mode = True
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
workers = 2
max_cron_threads = 1
limit_memory_soft = 629145600
limit_memory_hard = 1073741824
limit_request = 8192
limit_time_cpu = 120
limit_time_real = 240
log_level = info
log_handler = :INFO
without_demo = True
