server {
    listen 54.36.60.51:80;
    listen [2001:41d0:303:4233::1]:80;
    server_name preprod.odoo.ent.koba.sarl;
    return 301 https://$host$request_uri;
}

server {
    listen 54.36.60.51:443 ssl http2;
    listen [2001:41d0:303:4233::1]:443 ssl http2;
    server_name preprod.odoo.ent.koba.sarl;

    ssl_certificate /etc/letsencrypt/live/preprod.odoo.ent.koba.sarl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preprod.odoo.ent.koba.sarl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;
    access_log /var/log/nginx/preprod.odoo.ent.koba.sarl.access.log;
    error_log /var/log/nginx/preprod.odoo.ent.koba.sarl.error.log warn;

    auth_basic "Odoo CSRS ENT";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:18069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
